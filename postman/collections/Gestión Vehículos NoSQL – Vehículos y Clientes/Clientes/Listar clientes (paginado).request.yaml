$kind: http-request
url: "{{baseUrl}}/clientes?page=1&limit=10&sort=nombre"
method: GET
queryParams:
  page: "1"
  limit: "10"
  sort: nombre
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Formato de listado", () => { const j = pm.response.json(); pm.expect(j).to.have.keys("data","page","limit","total"); });
    language: text/javascript
order: 2000
