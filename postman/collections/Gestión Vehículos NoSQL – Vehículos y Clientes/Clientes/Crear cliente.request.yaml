$kind: http-request
url: "{{baseUrl}}/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Juan Pérez",
      "dui": "05123456-7",
      "telefono": "70001234",
      "email": "juan.perez@correo.com",
      "direccion": {
        "departamento": "San Salvador",
        "municipio": "San Marcos",
        "detalle": "Col. Las Brisas #12"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("clienteId", pm.response.json()._id);
    language: text/javascript
order: 1000
