$kind: http-request
name: "Error 400: DUI con formato inválido"
url: "{{baseUrl}}/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Juan Pérez",
      "dui": "0512",
      "telefono": "70001234",
      "email": "juan.perez@correo.com",
      "direccion": {
        "departamento": "San Salvador",
        "municipio": "San Marcos",
        "detalle": "Col. Las Brisas #12"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Formato de error", () => pm.expect(pm.response.json()).to.have.property("error"));
    language: text/javascript
order: 2000
