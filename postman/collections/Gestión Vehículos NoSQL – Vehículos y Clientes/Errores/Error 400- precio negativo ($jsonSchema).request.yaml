$kind: http-request
name: "Error 400: precio negativo ($jsonSchema)"
url: "{{baseUrl}}/vehiculos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "vin": "JTDBR32E720999999",
      "marca": "Toyota",
      "modelo": "Corolla",
      "anio": 2019,
      "precio": -500,
      "costo_compra": 9800,
      "kilometraje": 45000,
      "caracteristicas": {
        "transmision": "automatica",
        "combustible": "gasolina",
        "color": "Blanco"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Formato de error", () => pm.expect(pm.response.json()).to.have.property("error"));
    language: text/javascript
order: 1000
