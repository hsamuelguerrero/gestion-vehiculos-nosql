$kind: http-request
name: "Error 400: id inválido"
url: "{{baseUrl}}/vehiculos/123"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("Formato de error", () => pm.expect(pm.response.json()).to.have.property("error"));
    language: text/javascript
order: 3000
