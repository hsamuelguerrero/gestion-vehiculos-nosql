$kind: http-request
url: "{{baseUrl}}/vehiculos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "vin": "JTDBR32E720123456",
      "marca": "Toyota",
      "modelo": "Corolla",
      "anio": 2019,
      "precio": 12500,
      "costo_compra": 9800,
      "kilometraje": 45000,
      "caracteristicas": {
        "transmision": "automatica",
        "combustible": "gasolina",
        "color": "Blanco"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("vehiculoId", pm.response.json()._id);
    language: text/javascript
order: 1000
