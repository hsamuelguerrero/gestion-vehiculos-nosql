$kind: http-request
name: "Filtrar: Toyota disponibles, más caros primero"
url: "{{baseUrl}}/vehiculos?marca=toyota&estado=disponible&sort=precio&order=desc"
method: GET
queryParams:
  marca: toyota
  estado: disponible
  sort: precio
  order: desc
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Formato de listado", () => { const j = pm.response.json(); pm.expect(j).to.have.keys("data","page","limit","total"); });
    language: text/javascript
order: 3000
