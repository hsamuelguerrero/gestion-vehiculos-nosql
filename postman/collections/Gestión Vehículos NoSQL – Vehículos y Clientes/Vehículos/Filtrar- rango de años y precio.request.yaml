$kind: http-request
name: "Filtrar: rango de años y precio"
url: "{{baseUrl}}/vehiculos?anio_min=2015&anio_max=2020&precio_max=15000&sort=anio"
method: GET
queryParams:
  anio_min: "2015"
  anio_max: "2020"
  precio_max: "15000"
  sort: anio
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Formato de listado", () => { const j = pm.response.json(); pm.expect(j).to.have.keys("data","page","limit","total"); });
    language: text/javascript
order: 4000
