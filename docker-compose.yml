version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb_concesionario
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: concesionario_db
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo:/docker-entrypoint-initdb.d

volumes:
  mongo_data: